name: CI

# The pipeline fails if any backend test fails - images are only built and
# pushed from a green test run.

on:
  push:
    branches: [main]
  pull_request:

env:
  POSTGRES_USER: task_admin
  POSTGRES_PASSWORD: task_password
  JWT_SECRET_KEY: ci-secret
  INTERNAL_SERVICE_TOKEN: ci-internal-token
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            database: auth_db
          - service: engagement-service
            database: engagement_db
          - service: task-service
            database: task_db

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: task_admin
          POSTGRES_PASSWORD: task_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt

      - name: Create the service database
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U $POSTGRES_USER -d postgres \
            -c "CREATE DATABASE ${{ matrix.database }};"

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          POSTGRES_DB: ${{ matrix.database }}
        run: pytest

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - working-directory: services/worker-service
        run: |
          pip install -r requirements.txt
          python -m pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: |
          npm install
          npm run build

  build-and-push:
    # Only runs on main, and only after every test job has passed.
    needs: [backend-tests, worker-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        service:
          - auth-service
          - engagement-service
          - task-service
          - worker-service

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ matrix.service }}
        run: |
          docker build -t "$REGISTRY/$IMAGE:$GITHUB_SHA" -t "$REGISTRY/$IMAGE:latest" \
            "services/$IMAGE"
          docker push "$REGISTRY/$IMAGE:$GITHUB_SHA"
          docker push "$REGISTRY/$IMAGE:latest"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ matrix.service }}" \
            --force-new-deployment
